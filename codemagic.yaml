workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS App
        script: |
          xcodebuild \
            -project "Ledger.xcodeproj" \
            -scheme "Ledger" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Ledger-Simulator.zip Ledger.app
    artifacts:
      - build/**/Products/Debug-iphonesimulator/*.zip
      - build/**/Products/Debug-iphonesimulator/*.app
